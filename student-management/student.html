<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My record | Student Management System</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">
  <nav class="side">
    <h3>Student Register</h3>
    <button class="on">My record</button>
    <button class="out" onclick="logout()">Sign out</button>
  </nav>
  <main>
    <h2 id="hello">My record</h2>
    <div class="card who" id="profile"></div>

    <h3 style="margin:1.5rem 0 .7rem">Attendance</h3>
    <div class="wrap"><table>
      <thead><tr><th>Course</th><th>Present</th><th>Percentage</th><th></th></tr></thead>
      <tbody id="attBody"></tbody>
    </table></div>

    <h3 style="margin:1.5rem 0 .7rem">Marks</h3>
    <div class="wrap"><table>
      <thead><tr><th>Course</th><th>Exam</th><th>Score</th></tr></thead>
      <tbody id="markBody"></tbody>
    </table></div>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="assets/js/app.js"></script>
<script src="assets/js/student.js"></script>
</body>
</html>
